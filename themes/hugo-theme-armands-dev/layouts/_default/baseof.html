<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="page-portfolio">
  <a class="skip-link" href="#site-main">{{ i18n "ui.skipToContent" | default "Skip to main content" }}</a>
  {{ partial "nav.html" . }}
  <main class="site-main" id="site-main">
    <div class="wrap">
      {{ block "main" . }}{{ end }}
      {{ partial "social.html" . }}
    </div>
  </main>
  {{ partial "footer.html" . }}
  {{ block "scripts" . }}{{ end }}
<script src="{{ "assets/scripts/to-top.js" | relURL }}" defer></script>
</body>
</html>
