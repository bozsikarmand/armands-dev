{{ define "main" }}
<section class="not-found" style="text-align:center; padding:3rem 1rem;">
  <h1 style="font-size:4rem; margin-bottom:0.5rem;">404</h1>
  <p style="color:var(--muted); margin-bottom:1.5rem;">{{ i18n "ui.notFound" | default "The page you are looking for does not exist." }}</p>

  <div class="search-404" id="search-404-box" data-index="{{ "searchindex.json" | relLangURL }}" style="max-width:30rem; margin:0 auto 1.5rem; position:relative;">
    <input id="search-404" type="search" class="search-404__input"
           placeholder="{{ i18n "ui.searchPlaceholder" | default "Search…" }}"
           aria-label="{{ i18n "ui.searchPlaceholder" | default "Search" }}" autocomplete="off"
           style="width:100%; box-sizing:border-box; padding:0.6rem 0.9rem; border-radius:6px;
                  background:var(--input-bg); border:1px solid var(--border); color:var(--input-text);
                  font-size:1rem; font-family:inherit;">
    <div id="search-404-results" class="search-404__results" hidden
         style="position:absolute; left:0; right:0; top:100%; margin-top:0.25rem; z-index:10;
                background:var(--bg-alt); border:1px solid var(--border); border-radius:6px;
                overflow:hidden; text-align:left;"></div>
  </div>

  <p><a href="{{ "/" | relLangURL }}" class="button-cta" style="width:auto; display:inline-block; padding:0.7rem 2.5rem;">{{ i18n "ui.notFoundHome" | default "Back to home" }}</a></p>
</section>
<style>
  .search-404__results a {
    display: block;
    padding: 0.55rem 0.9rem;
    color: var(--accent);
    text-decoration: none;
  }
  .search-404__results a:hover { background: var(--input-bg); }
</style>
<script src="{{ "assets/js/fuse.min.js" | relURL }}" defer></script>
<script src="{{ "assets/scripts/404-search.js" | relURL }}" defer></script>
{{ end }}
