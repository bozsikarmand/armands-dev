{{ define "main" }}
<section class="not-found" style="text-align:center; padding:4rem 1rem;">
  <h1 style="font-size:4rem; margin-bottom:0.5rem;">404</h1>
  <p style="color:var(--muted); margin-bottom:2rem;">{{ i18n "ui.notFound" | default "The page you are looking for does not exist." }}</p>
  <p><a href="{{ "/" | relLangURL }}" class="button-cta" style="width:auto; display:inline-block; padding:0.7rem 2.5rem;">{{ i18n "ui.notFoundHome" | default "Back to home" }}</a></p>
</section>
{{ end }}
